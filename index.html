<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.json">
<title>P2Pじゃんけん v2.1</title>
<style>
body{margin:0;background:#0b1020;color:#f8fafc;font-family:system-ui,sans-serif}
main{max-width:800px;margin:auto;padding:16px}
.card{background:#151d31;border:1px solid #29344d;border-radius:16px;padding:16px;margin:12px 0}
h1{font-size:25px;margin:0 0 5px}.muted{color:#a8b3c7;font-size:14px}
h2{font-size:18px}
button{border:0;border-radius:11px;padding:12px 15px;font-weight:700;color:white;background:#2563eb;margin:4px;min-height:44px}
button.secondary{background:#334155}button.danger{background:#b91c1c}button:disabled{opacity:.45}
textarea{width:100%;min-height:120px;box-sizing:border-box;background:#0f172a;color:#eee;border:1px solid #3a4865;border-radius:10px;padding:10px}
select{width:100%;padding:12px;background:#0f172a;color:white;border:1px solid #3a4865;border-radius:10px}
.status{padding:11px;background:#0f172a;border:1px solid #29344d;border-radius:11px}
.diag{font-family:ui-monospace,monospace;font-size:12px;line-height:1.55;white-space:pre-wrap;background:#080d18;border-radius:10px;padding:10px;margin-top:10px;color:#cbd5e1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player{text-align:center;padding:12px;background:#0f172a;border-radius:12px}.score{font-size:34px;font-weight:800}
.result{text-align:center;font-size:21px;font-weight:800;min-height:32px;margin:12px}
.choice{font-size:40px;min-width:90px}.file{padding:7px 0;border-bottom:1px solid #29344d;display:flex;justify-content:space-between;gap:8px}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#334155;font-size:12px;margin-left:6px}
@media(max-width:430px){.choice{font-size:32px;min-width:0;width:29%}}
</style>
</head>
<body><main>
<h1>✊✌️✋ P2Pじゃんけん v2.1</h1>
<div class="muted">PWA + ローカルデータ + WebRTC P2P / 接続診断版</div>

<section class="card">
<h2>① P2P接続</h2>
<div id="status" class="status">未接続</div>
<div class="muted" style="margin-top:8px">
A側：Offer作成 → Bへ送る → BのAnswerを貼る<br>
B側：AのOfferを貼る → Answer作成 → Aへ送る
</div>
<button id="makeOffer">A: Offer作成</button>
<button id="readOffer" class="secondary">B: Offer読み込み</button>
<button id="readAnswer" class="secondary">A: Answer読み込み</button>
<button id="reset" class="danger">リセット</button>
<textarea id="signal" placeholder="ここにOffer / Answer JSONを貼り付けます"></textarea>
<div id="diag" class="diag">診断情報：まだ接続処理を開始していません</div>
</section>

<section class="card"><h2>② ゲームデータフォルダ</h2>
<p class="muted">ユーザーが選んだフォルダだけを読みます。外部サーバーへ自動送信しません。</p>
<button id="chooseDir">フォルダを選択</button><button id="rescan" class="secondary" disabled>再スキャン</button>
<div id="dirStatus" class="muted">未選択</div><div id="fileList"></div></section>

<section class="card"><h2>③ P2Pファイル転送</h2>
<select id="fileSelect" disabled><option>先にフォルダを選択してください</option></select>
<button id="sendFile" disabled>選択ファイルを送信</button>
<div id="transferStatus" class="muted">待機中</div>
<progress id="progress" max="100" value="0" style="width:100%"></progress></section>

<section class="card"><h2>④ じゃんけん</h2>
<div class="grid">
<div class="player">あなた<div id="myScore" class="score">0</div></div>
<div class="player">相手<div id="opScore" class="score">0</div></div>
</div>
<div id="result" class="result">接続してください</div>
<div style="text-align:center">
<button class="choice" data-hand="rock" disabled>✊</button>
<button class="choice" data-hand="scissors" disabled>✌️</button>
<button class="choice" data-hand="paper" disabled>✋</button>
</div>
<div style="text-align:center"><button id="nextRound" class="secondary" disabled>次のラウンド</button></div>
</section>

<section class="card"><h2>受信ファイル</h2><div id="received" class="muted">まだありません</div></section>
</main>

<script>
(()=>{"use strict";

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

let pc=null,dc=null,dir=null,files=[],incoming=null;
let myHand=null,opHand=null,myScore=0,opScore=0;
let role="";
let iceWaitTimer=null;

const hands={rock:"✊",scissors:"✌️",paper:"✋"};
const beats={rock:"scissors",scissors:"paper",paper:"rock"};
const CHUNK=16384;

const status=s=>$("#status").textContent=s;

function log(s){
  const d=$("#diag");
  const now=new Date().toLocaleTimeString();
  d.textContent=`[${now}] ${s}\n`+d.textContent;
}

function updateDiag(){
  if(!pc)return;
  log(`connection=${pc.connectionState}, ice=${pc.iceConnectionState}, gathering=${pc.iceGatheringState}, signaling=${pc.signalingState}`);
}

function send(o){
  if(dc?.readyState==="open") dc.send(JSON.stringify(o));
}

function ready(v){
  $$(".choice").forEach(x=>x.disabled=!v);
  $("#nextRound").disabled=!v;
  $("#sendFile").disabled=!v||!files.length;
}

function score(){
  $("#myScore").textContent=myScore;
  $("#opScore").textContent=opScore;
}

function resetPeer(){
  if(iceWaitTimer) clearTimeout(iceWaitTimer);
  iceWaitTimer=null;
  if(dc){try{dc.close()}catch{}}
  if(pc){try{pc.close()}catch{}}
  pc=null;dc=null;role="";
  ready(false);
  status("未接続");
  log("P2P接続をリセットしました");
}

function bind(ch){
  dc=ch;
  dc.binaryType="arraybuffer";
  dc.onopen=()=>{
    status("接続済み（P2P）");
    ready(true);
    $("#result").textContent="手を選んでください";
    log("DataChannel OPEN。P2P通信開始");
    send({t:"hello"});
  };
  dc.onclose=()=>{
    status("切断");
    ready(false);
    log("DataChannel CLOSED");
  };
  dc.onerror=e=>{
    status("データチャンネルエラー");
    log("DataChannel ERROR");
  };
  dc.onmessage=e=>{
    if(typeof e.data==="string"){
      try{msg(JSON.parse(e.data))}catch(err){log("受信JSON解析エラー")}
    }else{
      bin(e.data)
    }
  };
}

function setup(offerer){
  resetPeer();
  role=offerer?"A":"B";

  pc=new RTCPeerConnection({
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"stun:stun1.l.google.com:19302"},
      {urls:"stun:stun.cloudflare.com:3478"}
    ]
  });

  pc.onicecandidate=e=>{
    if(e.candidate){
      log(`ICE candidate取得: ${e.candidate.type || "unknown"}`);
    }else{
      log("ICE candidate収集完了");
    }
  };

  pc.onicegatheringstatechange=()=>{
    log("ICE gathering: "+pc.iceGatheringState);
  };

  pc.oniceconnectionstatechange=()=>{
    log("ICE connection: "+pc.iceConnectionState);
    updateDiag();

    if(pc.iceConnectionState==="connected" || pc.iceConnectionState==="completed"){
      status("P2P経路確立。接続待ち…");
    }else if(pc.iceConnectionState==="checking"){
      status("P2P接続経路を確認中…");
    }else if(pc.iceConnectionState==="failed"){
      status("P2P接続失敗");
      ready(false);
      log("ICE FAILED：STUNで直接経路を作れない可能性があります");
    }else if(pc.iceConnectionState==="disconnected"){
      status("P2P一時切断");
    }
  };

  pc.onconnectionstatechange=()=>{
    log("Peer connection: "+pc.connectionState);
    if(pc.connectionState==="connected"){
      status("接続済み（P2P）");
      ready(true);
    }else if(pc.connectionState==="connecting"){
      status("P2P接続中…");
    }else if(["failed","disconnected","closed"].includes(pc.connectionState)){
      ready(false);
    }
  };

  pc.onsignalingstatechange=()=>log("signaling: "+pc.signalingState);

  if(offerer){
    bind(pc.createDataChannel("game"));
  }else{
    pc.ondatachannel=e=>{
      log("DataChannelを受信");
      bind(e.channel);
    };
  }
}

async function waitIce(){
  if(pc.iceGatheringState==="complete") return;
  return new Promise(resolve=>{
    let done=false;
    const finish=()=>{
      if(done)return;
      done=true;
      clearTimeout(iceWaitTimer);
      resolve();
    };
    pc.addEventListener("icegatheringstatechange",()=>{
      if(pc.iceGatheringState==="complete")finish();
    });
    iceWaitTimer=setTimeout(()=>{
      log("ICE収集タイムアウト。現在取得できた候補で続行します");
      finish();
    },15000);
  });
}

function getSignal(){
  const raw=$("#signal").value.trim();
  if(!raw) throw Error("Offer / Answer JSONが空です");
  return JSON.parse(raw);
}

$("#makeOffer").onclick=async()=>{
  try{
    setup(true);
    status("Offer作成中…");
    await pc.setLocalDescription(await pc.createOffer());
    log("Offerを作成。ICE候補を収集中…");
    await waitIce();
    $("#signal").value=JSON.stringify(pc.localDescription);
    status("Offer完成。これをBへ送ってください");
    log("Offer JSON生成完了。LINE等でBへ送信してください");
  }catch(e){
    status("Offer失敗: "+e.message);
    log("ERROR: "+e.stack);
  }
};

$("#readOffer").onclick=async()=>{
  try{
    const offer=getSignal();
    if(offer.type!=="offer") throw Error("これはOfferではありません");
    setup(false);
    status("Offer読み込み中…");
    await pc.setRemoteDescription(offer);
    log("OfferをRemoteDescriptionへ設定");
    await pc.setLocalDescription(await pc.createAnswer());
    log("Answerを作成。ICE候補を収集中…");
    await waitIce();
    $("#signal").value=JSON.stringify(pc.localDescription);
    status("Answer完成。これをAへ送ってください");
    log("Answer JSON生成完了。LINE等でAへ送信してください");
  }catch(e){
    status("Offer読み込み失敗: "+e.message);
    log("ERROR: "+e.stack);
  }
};

$("#readAnswer").onclick=async()=>{
  try{
    if(!pc) throw Error("先にA側でOfferを作成してください");
    const answer=getSignal();
    if(answer.type!=="answer") throw Error("これはAnswerではありません");
    await pc.setRemoteDescription(answer);
    status("Answer設定済み。P2P接続待ち…");
    log("AnswerをRemoteDescriptionへ設定");
    updateDiag();
  }catch(e){
    status("Answer読み込み失敗: "+e.message);
    log("ERROR: "+e.stack);
  }
};

$("#reset").onclick=()=>{
  resetPeer();
  $("#signal").value="";
  $("#diag").textContent="診断情報：リセットしました";
};

async function scan(){
  if(!dir)return;
  files=[];
  async function walk(h,p=""){
    for await(const [name,e] of h.entries()){
      if(e.kind==="file"){
        const f=await e.getFile();
        files.push({path:p+name,handle:e,size:f.size,type:f.type});
      }else if(files.length<5000){
        await walk(e,p+name+"/");
      }
      if(files.length>=5000)break;
    }
  }
  await walk(dir);

  $("#dirStatus").textContent=`${dir.name} / ${files.length}ファイル / ${(files.reduce((n,f)=>n+f.size,0)/1048576).toFixed(2)} MB`;
  $("#fileList").innerHTML=files.slice(0,30).map(f=>
    `<div class="file"><span>${esc(f.path)}</span><span>${(f.size/1024).toFixed(1)} KB</span></div>`
  ).join("")+(files.length>30?"<p class='muted'>先頭30件のみ表示</p>":"");

  $("#fileSelect").innerHTML=files.length
    ?files.map((f,i)=>`<option value="${i}">${esc(f.path)} (${(f.size/1048576).toFixed(2)} MB)</option>`).join("")
    :"<option>ファイルなし</option>";

  $("#fileSelect").disabled=!files.length;
  $("#rescan").disabled=false;
  $("#sendFile").disabled=!files.length||!dc||dc.readyState!=="open";
}

function esc(s){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

$("#chooseDir").onclick=async()=>{
  if(!window.showDirectoryPicker){
    $("#dirStatus").textContent="File System Access API非対応です";
    return;
  }
  try{
    dir=await showDirectoryPicker({mode:"read",id:"janken-data"});
    await scan();
  }catch(e){
    if(e.name!=="AbortError")$("#dirStatus").textContent=e.message;
  }
};

$("#rescan").onclick=scan;

$("#sendFile").onclick=async()=>{
  if(!dc||dc.readyState!=="open")return;
  const f=files[+$("#fileSelect").value];
  if(!f)return;

  const b=await f.handle.getFile();
  if(b.size>100*1024*1024){
    $("#transferStatus").textContent="試作版では100MB以下を推奨";
    return;
  }

  send({t:"file-start",name:f.path,size:b.size,type:b.type});
  let o=0;
  $("#progress").value=0;

  while(o<b.size){
    const e=Math.min(o+CHUNK,b.size);
    const buf=await b.slice(o,e).arrayBuffer();

    while(dc.bufferedAmount>4194304){
      await new Promise(r=>setTimeout(r,20));
    }

    dc.send(buf);
    o=e;
    $("#progress").value=b.size?o/b.size*100:100;
    $("#transferStatus").textContent=`送信中: ${f.path} ${(o/b.size*100).toFixed(1)}%`;
  }

  send({t:"file-end"});
  $("#transferStatus").textContent="送信完了: "+f.path;
};

function msg(m){
  if(m.t==="hand"){
    opHand=m.hand;
    finish();
  }else if(m.t==="next"){
    myHand=opHand=null;
    $("#result").textContent="手を選んでください";
  }else if(m.t==="score"){
    myScore=m.op;
    opScore=m.me;
    score();
  }else if(m.t==="file-start"){
    incoming={name:m.name,size:m.size,type:m.type,parts:[],got:0};
    $("#progress").value=0;
    $("#transferStatus").textContent="受信中: "+m.name;
  }else if(m.t==="file-end"){
    finishFile();
  }else if(m.t==="hello"){
    log("相手からhelloを受信");
  }
}

function bin(b){
  if(!incoming)return;
  incoming.parts.push(b);
  incoming.got+=b.byteLength;
  $("#progress").value=incoming.size?incoming.got/incoming.size*100:100;
  $("#transferStatus").textContent=`受信中: ${incoming.name} ${(incoming.got/incoming.size*100).toFixed(1)}%`;
}

function finishFile(){
  if(!incoming)return;
  const b=new Blob(incoming.parts,{type:incoming.type||"application/octet-stream"});
  const u=URL.createObjectURL(b);
  const a=document.createElement("a");
  a.href=u;
  a.download=incoming.name.split("/").pop();
  a.textContent=`⬇ ${incoming.name} (${(b.size/1048576).toFixed(2)} MB)`;
  a.style.display="block";
  $("#received").appendChild(a);
  $("#transferStatus").textContent="受信完了: "+incoming.name;
  incoming=null;
}

$$(".choice").forEach(b=>b.onclick=()=>{
  if(!dc||dc.readyState!=="open"||myHand)return;
  myHand=b.dataset.hand;
  $("#result").textContent="相手を待っています…";
  send({t:"hand",hand:myHand});
  if(opHand)finish();
});

$("#nextRound").onclick=()=>{
  myHand=opHand=null;
  $("#result").textContent="手を選んでください";
  send({t:"next"});
};

function finish(){
  if(!myHand||!opHand)return;
  if(myHand===opHand){
    $("#result").textContent=`あいこ ${hands[myHand]}`;
  }else if(beats[myHand]===opHand){
    $("#result").textContent=`あなたの勝ち！ ${hands[myHand]} vs ${hands[opHand]}`;
    myScore++;
  }else{
    $("#result").textContent=`あなたの負け… ${hands[myHand]} vs ${hands[opHand]}`;
    opScore++;
  }
  score();
  send({t:"score",me:opScore,op:myScore});
}

if("serviceWorker"in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

})();
</script>
</body>
</html>
