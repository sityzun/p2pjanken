<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="./manifest.json">
<title>ローカルゲームPWA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:system-ui,sans-serif}
main{max-width:760px;margin:auto;padding:16px}
.card{background:#182235;border:1px solid #293852;border-radius:16px;padding:18px;margin:12px 0}
h1{margin:0 0 5px;font-size:25px}
h2{font-size:19px}
.muted{color:#aeb9cb;font-size:14px}
button{padding:12px 17px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:bold;margin:4px}
button:disabled{opacity:.4}
.status{padding:12px;background:#0b1220;border-radius:10px;margin:10px 0}
#gameTitle{text-align:center;font-size:28px;margin:5px}
#result{text-align:center;font-size:24px;font-weight:bold;min-height:40px;margin:16px}
.hands{display:flex;justify-content:center;gap:10px}
.hand{background:#0b1220;border:1px solid #35445f;border-radius:14px;width:30%;padding:10px;text-align:center}
.hand img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;display:block}
.hand button{width:100%;margin:6px 0 0}
#score{text-align:center;font-size:20px}
pre{background:#080d16;padding:12px;border-radius:10px;white-space:pre-wrap;font-size:12px}
</style>
</head>
<body>
<main>
<div class="card">
<h1>🎮 ローカルゲームPWA</h1>
<div class="muted">ゲーム本体はGitHub Pages、ゲームデータはスマホ/PCのローカルフォルダから読み込みます。</div>
<button id="choose">ゲームフォルダを選択</button>
<div id="folder" class="status">フォルダ未選択</div>
</div>

<div class="card">
<div id="gameTitle">ゲーム未読み込み</div>
<div id="gameDesc" class="muted" style="text-align:center"></div>
<div id="gameArea">
<div id="result">ゲームフォルダを選択してください</div>
<div id="score">あなた 0　-　0 CPU</div>
<div class="hands">
<div class="hand"><img id="rockImg" alt="グー"><button data-hand="rock" disabled>✊ グー</button></div>
<div class="hand"><img id="paperImg" alt="パー"><button data-hand="paper" disabled>✋ パー</button></div>
<div class="hand"><img id="scissorsImg" alt="チョキ"><button data-hand="scissors" disabled>✌️ チョキ</button></div>
</div>
<br>
<div style="text-align:center"><button id="reset" class="secondary">スコアリセット</button></div>
</div>
</div>

<div class="card">
<h2>読み込んだゲームデータ</h2>
<pre id="info">まだありません</pre>
</div>
</main>

<script>
"use strict";

let dir=null, game=null;
let myScore=0,cpuScore=0;
let urls=[];

const $=id=>document.getElementById(id);

function logInfo(s){
  $("info").textContent=s;
}

async function findFile(root,path){
  const parts=path.split("/").filter(Boolean);
  let h=root;
  for(const part of parts){
    h=await h.getFileHandle(part);
  }
  return h;
}

async function readJson(root){
  const h=await root.getFileHandle("game.json");
  const f=await h.getFile();
  return JSON.parse(await f.text());
}

async function loadImage(root,path,img){
  const h=await findFile(root,path);
  const f=await h.getFile();
  const u=URL.createObjectURL(f);
  urls.push(u);
  img.src=u;
}

async function loadGame(){
  urls.forEach(URL.revokeObjectURL);
  urls=[];

  game=await readJson(dir);

  if(!game.title) throw Error("game.jsonにtitleがありません");
  if(!game.hands) throw Error("game.jsonにhandsがありません");

  $("gameTitle").textContent=game.title;
  $("gameDesc").textContent=game.description||"";

  await loadImage(dir,game.hands.rock.image,$("rockImg"));
  await loadImage(dir,game.hands.paper.image,$("paperImg"));
  await loadImage(dir,game.hands.scissors.image,$("scissorsImg"));

  document.querySelectorAll(".hand button").forEach(b=>b.disabled=false);

  logInfo(JSON.stringify(game,null,2));
  $("folder").textContent=`読み込み成功：${dir.name}`;
  $("result").textContent="手を選んでください";
}

$("choose").onclick=async()=>{
  try{
    if(!window.showDirectoryPicker){
      throw Error("このブラウザはFile System Access APIに対応していません");
    }

    dir=await showDirectoryPicker({mode:"read",id:"janken-game"});
    await loadGame();
  }catch(e){
    if(e.name==="AbortError")return;
    $("folder").textContent="読み込み失敗: "+e.message;
    console.error(e);
  }
};

document.querySelectorAll(".hand button").forEach(b=>{
  b.onclick=()=>{
    const me=b.dataset.hand;
    const list=["rock","paper","scissors"];
    const cpu=list[Math.floor(Math.random()*3)];

    if(me===cpu){
      $("result").textContent=`あいこ！ ${game.hands[me].name} vs ${game.hands[cpu].name}`;
    }else if(game.hands[me].beats===cpu){
      myScore++;
      $("result").textContent=`勝ち！ ${game.hands[me].name} vs ${game.hands[cpu].name}`;
    }else{
      cpuScore++;
      $("result").textContent=`負け… ${game.hands[me].name} vs ${game.hands[cpu].name}`;
    }

    $("score").textContent=`あなた ${myScore}　-　${cpuScore} CPU`;
  };
});

$("reset").onclick=()=>{
  myScore=cpuScore=0;
  $("score").textContent="あなた 0　-　0 CPU";
  $("result").textContent=game?"手を選んでください":"ゲームフォルダを選択してください";
};

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(console.error);
}
</script>
</body>
</html>
