<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>ローカルじゃんけんゲームエディター</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
main{max-width:900px;margin:auto;padding:20px}
h1{font-size:24px;margin:0 0 6px}
h2{font-size:18px;margin:24px 0 12px}
.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}
button{border:0;border-radius:9px;padding:10px 14px;font-size:15px;cursor:pointer;background:#2563eb;color:white}
button.secondary{background:#4b5563}
button.save{background:#059669}
button:disabled{opacity:.5;cursor:not-allowed}
.status{margin:10px 0;padding:10px;border-radius:8px;background:#eef2ff}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
label{display:block;font-weight:600;margin:12px 0 5px}
input[type=text],textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font:inherit}
textarea{min-height:80px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.hand{border:1px solid #e5e7eb;border-radius:12px;padding:14px}
.preview{height:120px;display:flex;align-items:center;justify-content:center;background:#f9fafb;border-radius:8px;margin-bottom:10px}
.preview img{max-width:100%;max-height:110px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
small{color:#6b7280}
pre{white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:14px;border-radius:8px;overflow:auto}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>ローカルじゃんけんゲーム エディター</h1>
  <p>ローカルフォルダ内の <code>game.json</code> と画像を読み込み、ゲーム内容を編集できます。</p>

  <div class="card">
    <div class="actions">
      <button id="choose">ゲームフォルダを選択</button>
      <button id="reload" class="secondary" disabled>再読み込み</button>
      <button id="save" class="save" disabled>game.jsonを保存</button>
    </div>
    <div id="folder" class="status">フォルダ未選択</div>
    <small>保存するにはフォルダへの書き込み許可が必要です。</small>
  </div>

  <div id="editor" class="card" hidden>
    <h2>ゲーム基本情報</h2>
    <label>ゲームタイトル</label>
    <input id="title" type="text">

    <label>説明</label>
    <textarea id="description"></textarea>

    <label>バージョン</label>
    <input id="version" type="text">

    <h2>手の設定</h2>
    <div class="grid" id="hands"></div>

    <h2>現在のgame.json</h2>
    <pre id="jsonPreview"></pre>
  </div>

  <div id="game" class="card" hidden>
    <h2>ゲームをプレイ</h2>
    <div id="playHands" class="grid"></div>
    <div id="result" class="status">手を選んでください</div>
    <div>プレイヤー: <b id="playerScore">0</b>　CPU: <b id="cpuScore">0</b></div>
    <br>
    <button id="reset" class="secondary">スコアリセット</button>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
let dir=null;
let gameData=null;
let objectUrls=[];
let handKeys=["rock","paper","scissors"];

$("choose").onclick=async()=>{
  try{
    dir=await showDirectoryPicker({mode:"readwrite",id:"janken-game-editor"});
    $("folder").textContent="選択中: "+dir.name;
    await loadGame();
  }catch(e){
    if(e.name==="AbortError")return;
    showError(e);
  }
};

$("reload").onclick=()=>loadGame();

async function getFileHandle(root,path){
  const parts=String(path||"").replaceAll("\\","/").split("/").filter(Boolean);
  if(!parts.length) throw Error("ファイルパスが空です");
  let current=root;
  for(let i=0;i<parts.length-1;i++){
    current=await current.getDirectoryHandle(parts[i],{create:false});
  }
  return await current.getFileHandle(parts[parts.length-1],{create:false});
}

async function readJson(){
  const h=await dir.getFileHandle("game.json",{create:false});
  const f=await h.getFile();
  return JSON.parse(await f.text());
}

async function loadGame(){
  try{
    gameData=await readJson();
    validateGame();
    renderEditor();
    renderGame();
    $("editor").hidden=false;
    $("game").hidden=false;
    $("reload").disabled=false;
    $("save").disabled=false;
    setStatus("game.jsonを読み込みました。編集できます。","success");
  }catch(e){
    showError(e);
  }
}

function validateGame(){
  if(!gameData || typeof gameData!=="object") throw Error("game.jsonの形式が不正です");
  if(!gameData.hands) throw Error("game.jsonに hands がありません");
  for(const key of handKeys){
    if(!gameData.hands[key]) throw Error(`hands.${key} がありません`);
    if(!gameData.hands[key].name) throw Error(`hands.${key}.name がありません`);
    if(!gameData.hands[key].image) throw Error(`hands.${key}.image がありません`);
    if(!gameData.hands[key].beats) throw Error(`hands.${key}.beats がありません`);
  }
}

function renderEditor(){
  $("title").value=gameData.title||"";
  $("description").value=gameData.description||"";
  $("version").value=gameData.version||"";

  const names={rock:"グー",paper:"パー",scissors:"チョキ"};
  $("hands").innerHTML="";

  for(const key of handKeys){
    const h=gameData.hands[key];
    const div=document.createElement("div");
    div.className="hand";
    div.innerHTML=`
      <h3>${names[key]}</h3>
      <div class="preview"><img id="preview-${key}" alt=""></div>
      <label>表示名</label>
      <input type="text" id="name-${key}">
      <label>画像パス</label>
      <input type="text" id="image-${key}">
      <button type="button" class="secondary" id="imageBtn-${key}">画像を選んで差し替え</button>
      <label>勝てる相手</label>
      <select id="beats-${key}" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font:inherit">
        <option value="rock">グー</option>
        <option value="paper">パー</option>
        <option value="scissors">チョキ</option>
      </select>
      <input type="file" id="file-${key}" accept="image/*" hidden>
    `;
    $("hands").appendChild(div);

    $(`name-${key}`).value=h.name;
    $(`image-${key}`).value=h.image;
    $(`beats-${key}`).value=h.beats;

    $(`name-${key}`).oninput=()=>{gameData.hands[key].name=$(`name-${key}`).value; updatePreview()};
    $(`image-${key}`).oninput=()=>{gameData.hands[key].image=$(`image-${key}`).value; updatePreview()};
    $(`beats-${key}`).onchange=()=>{gameData.hands[key].beats=$(`beats-${key}`).value; updatePreview()};

    $(`imageBtn-${key}`).onclick=()=>$(`file-${key}`).click();
    $(`file-${key}`).onchange=async e=>{
      const file=e.target.files[0];
      if(!file)return;
      try{
        await replaceImage(key,file);
      }catch(err){showError(err)}
    };
  }
  updatePreview();
}

async function replaceImage(key,file){
  const oldPath=gameData.hands[key].image;
  const parts=oldPath.replaceAll("\\","/").split("/").filter(Boolean);
  if(!parts.length) throw Error("現在の画像パスが空です");

  // 元画像と同じフォルダへ、選択したファイル名で保存
  const newPath=parts.slice(0,-1).concat(file.name).join("/");
  let current=dir;
  for(const p of parts.slice(0,-1)){
    current=await current.getDirectoryHandle(p,{create:false});
  }

  const fh=await current.getFileHandle(file.name,{create:true});
  const writable=await fh.createWritable();
  await writable.write(file);
  await writable.close();

  gameData.hands[key].image=newPath;
  $(`image-${key}`).value=newPath;
  updatePreview();
  setStatus(`${key} の画像を ${newPath} に差し替えました。game.jsonを保存すると設定も反映されます。`,"success");
}

async function makeObjectUrl(path){
  const h=await getFileHandle(dir,path);
  const f=await h.getFile();
  const u=URL.createObjectURL(f);
  objectUrls.push(u);
  return u;
}

async function updatePreview(){
  $("jsonPreview").textContent=JSON.stringify(gameData,null,2);
  for(const key of handKeys){
    const img=$(`preview-${key}`);
    if(!img)continue;
    try{
      const u=await makeObjectUrl(gameData.hands[key].image);
      img.src=u;
    }catch(e){
      img.removeAttribute("src");
      img.alt="画像を読み込めません";
    }
  }
}

async function saveGame(){
  try{
    gameData.title=$("title").value;
    gameData.description=$("description").value;
    gameData.version=$("version").value;

    for(const key of handKeys){
      gameData.hands[key].name=$(`name-${key}`).value;
      gameData.hands[key].image=$(`image-${key}`).value;
      gameData.hands[key].beats=$(`beats-${key}`).value;
    }

    validateGame();

    const fh=await dir.getFileHandle("game.json",{create:true});
    const writable=await fh.createWritable();
    await writable.write(JSON.stringify(gameData,null,2)+"\n");
    await writable.close();

    updatePreview();
    renderGame();
    setStatus("game.jsonを保存しました！","success");
  }catch(e){
    showError(e);
  }
}
$("save").onclick=saveGame;

function renderGame(){
  const area=$("playHands");
  area.innerHTML="";
  for(const key of handKeys){
    const h=gameData.hands[key];
    const b=document.createElement("button");
    b.style.background="#fff"; b.style.color="#111827"; b.style.border="1px solid #ddd";
    b.innerHTML=`<div><img id="play-${key}" style="width:90px;height:90px;object-fit:contain"></div><b>${escapeHtml(h.name)}</b>`;
    b.onclick=()=>play(key);
    area.appendChild(b);
    makeObjectUrl(h.image).then(u=>{const img=$(`play-${key}`);if(img)img.src=u}).catch(()=>{});
  }
}

let playerScore=0,cpuScore=0;
function play(player){
  const cpu=handKeys[Math.floor(Math.random()*handKeys.length)];
  const ph=gameData.hands[player], ch=gameData.hands[cpu];
  let msg=`あなた: ${ph.name} / CPU: ${ch.name}`;
  if(player===cpu)msg+=" → あいこ";
  else if(ph.beats===cpu){playerScore++;msg+=" → あなたの勝ち！"}
  else{cpuScore++;msg+=" → CPUの勝ち";}
  $("playerScore").textContent=playerScore;
  $("cpuScore").textContent=cpuScore;
  $("result").textContent=msg;
}
$("reset").onclick=()=>{
  playerScore=0;cpuScore=0;
  $("playerScore").textContent=0;
  $("cpuScore").textContent=0;
  $("result").textContent="手を選んでください";
};

function setStatus(msg,type=""){
  $("folder").textContent=msg;
  $("folder").className="status "+type;
}
function showError(e){
  setStatus("読み込み/保存失敗: "+e.message,"error");
  console.error(e);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js?v=editor1").catch(console.error);
}
</script>
</body>
</html>
